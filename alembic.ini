[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Intentionally blank. migrations/env.py takes the URL from
# shared.database.DATABASE_URL (the single source of truth the app itself
# uses), or from `alembic -x url=...` for scratch databases.
#
# Do not set it here: ConfigParser treats `%` as interpolation, so a
# DATABASE_PASSWORD containing `%` would break at startup in a confusing way.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
