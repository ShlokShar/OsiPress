<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>{% block title %}OsiPress{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500&family=Noto+Sans+Hebrew:wght@400;500&display=swap">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/osi.css') }}">
        {% block head %}{% endblock %}
        <link rel="icon" href="{{ url_for('static', filename='brand/favicon.svg') }}" type="image/svg+xml">
        <link rel="icon" href="{{ url_for('static', filename='brand/favicon-32.png') }}" sizes="32x32">
        <link rel="apple-touch-icon" href="{{ url_for('static', filename='brand/apple-touch-icon.png') }}">
    </head>
    <body{% if body_class %} class="{{ body_class }}"{% endif %}>
        {% include 'partials/header.html' %}
        {% block page %}{% endblock %}
        {% include 'partials/footer.html' %}
        <script src="{{ url_for('static', filename='js/shell.js') }}"></script>
        {% block scripts %}{% endblock %}
    </body>
</html>
